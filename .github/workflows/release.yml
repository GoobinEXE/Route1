name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex. v1.0.0); vazio = só build de artefactos"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade "pip>=26.2"

      - name: Install runtime (hashed lock)
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.11,<7"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Build macOS (portable zip + DMG)
        if: runner.os == 'macOS'
        run: |
          chmod +x tools/build_macos_release.sh
          ./tools/build_macos_release.sh

      - name: Build Windows (PyInstaller)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          chmod +x tools/build_windows_release.sh
          ROUTE1KIT_WIN_PHASE=build ./tools/build_windows_release.sh

      - name: Detect Windows code signing config
        if: runner.os == 'Windows'
        id: win_sign
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          if [[ -n "${AZURE_CLIENT_ID}" && -n "${AZURE_TENANT_ID}" && -n "${AZURE_SUBSCRIPTION_ID}" \
            && -n "${AZURE_TRUSTED_SIGNING_ENDPOINT}" && -n "${AZURE_TRUSTED_SIGNING_ACCOUNT}" \
            && -n "${AZURE_TRUSTED_SIGNING_PROFILE}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Assinatura Windows (Dark Room / Artifact Signing) activa."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Assinatura Windows omitida — secrets/vars Azure em falta (ver docs/WINDOWS_SIGNING.md)."
          fi

      - name: Azure login (OIDC)
        if: runner.os == 'Windows' && steps.win_sign.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows onedir (Dark Room)
        if: runner.os == 'Windows' && steps.win_sign.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          # Só o .exe principal — evita esgotar a quota do Artifact Signing com dezenas de DLLs do PyInstaller.
          files: ${{ github.workspace }}\dist\Route1Kit\Route1Kit.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package Windows (ZIP + Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ROUTE1KIT_WIN_PHASE=package ./tools/build_windows_release.sh

      - name: Sign Windows setup.exe (Dark Room)
        if: runner.os == 'Windows' && steps.win_sign.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\release_artifacts
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build Linux (portable + installer tarball)
        if: runner.os == 'Linux'
        run: |
          chmod +x tools/build_linux_release.sh
          # pywebview em headless: build do binário não precisa de display
          ./tools/build_linux_release.sh

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: route1kit-${{ matrix.artifact }}
          path: release_artifacts/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Publica mesmo se um SO falhar, desde que existam artefactos.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: release_download
          merge-multiple: true
          pattern: route1kit-*

      - name: Require at least one artefact
        run: |
          count=$(find release_download -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Ficheiros: ${count}"
          find release_download -type f -print || true
          test "$count" -gt 0

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            ## Route 1 Kit ${{ github.ref_name }}

            Builds **portátil** e **instalável** · publisher Windows: **Dark Room**.

            ### Downloads

            | Plataforma | Portátil | Instalável |
            |------------|----------|------------|
            | **macOS** | `*-portable.zip` (arraste o `.app`) | `*-installer.dmg` (arraste para Aplicações) |
            | **Windows** | `*-portable.zip` | `*-setup.exe` |
            | **Linux** | `*-portable.tar.gz` | `*-installer.tar.gz` (+ script de atalho) |

            ### Notas

            - Use um **cartão SD de teste** na primeira utilização.
            - macOS pode pedir confirmação em *Privacidade e Segurança* (binário não notarizado pela Apple nesta release).
            - Windows: builds assinados com Authenticode (Dark Room) quando o Azure Artifact Signing estiver configurado; caso contrário o SmartScreen pode avisar — “Mais informações” → Executar mesmo assim se confiar na origem.
            - Licença: GPL-3.0. Aviso legal e risco de brick: ver README.

            Changelog: ver `CHANGELOG.md` no repositório.
          files: release_download/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
